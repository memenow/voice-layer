# Redocly CLI configuration for VoiceLayer's Unix-socket control API.
#
# `voicelayerd` listens on a local Unix domain socket where filesystem
# permissions control access. Rules targeting public network APIs
# (transport auth and public host URLs) are disabled below.

extends:
  - minimal

rules:
  operation-4xx-response: warn
  info-license: warn
  security-defined: off
  no-server-example.com: off
