# `cargo audit` configuration. Anchors the supply-chain gate in CI
# and gives operators running the audit locally the same result.
#
# Scope: this file only governs warnings that have no upstream fix
# path from VoiceLayer's direct dependencies. Vulnerabilities and
# unsoundness advisories are NEVER ignored here — CI gates on them
# unconditionally via `cargo audit --deny vulnerabilities
# --deny unsound`.

[advisories]
# Advisories listed here surface as warnings in the audit output but
# do not fail CI. Every entry must justify why VoiceLayer cannot act
# on the advisory directly. Re-evaluate each entry when bumping the
# crate that pulls it in.
ignore = [
    # `paste 1.0.15` is unmaintained as of 2024-10-07. It reaches
    # the dependency graph through metal -> wgpu-hal -> wgpu ->
    # iced_wgpu -> iced (the GUI shell in vl-desktop). Neither
    # metal nor wgpu has cut a release that drops the paste
    # dependency yet; until they do, VoiceLayer has no upstream
    # path to swap it out, and the unmaintained status carries no
    # known soundness or vulnerability impact for our compile-time
    # macro usage.
    "RUSTSEC-2024-0436",
]
