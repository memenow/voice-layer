openapi: 3.1.0
info:
  title: VoiceLayer Local Control API
  version: 0.2.0
  description: |
    Local control API exposed by `voicelayerd` over a Unix domain socket.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost
    description: Logical placeholder; the daemon serves over a local Unix domain socket.
tags:
  - name: health
    description: Daemon, worker, and host capability health checks.
  - name: providers
    description: Registered ASR, LLM, TTS, and host adapter catalog.
  - name: events
    description: Live Server-Sent Events stream for daemon activity.
  - name: sessions
    description: Live dictation session lifecycle and inspection.
  - name: workflows
    description: Text composition, rewrite, and translation previews.
  - name: transcription
    description: Direct audio file and bounded-clip transcription.
  - name: injection
    description: Target-specific text injection planning.
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Read daemon health state.
      description: Returns the cached health report for the daemon, Python worker, providers, and global hotkey backend.
      responses:
        "200":
          description: Daemon health report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/health/refresh:
    post:
      operationId: refreshHealth
      tags: [health]
      summary: Probe worker and host capabilities on demand.
      description: Runs a fresh worker and platform probe and returns the updated daemon health report.
      responses:
        "200":
          description: Freshly probed daemon health report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List supported providers and host adapters.
      description: Returns the combined catalog of Rust host adapters and Python worker providers.
      responses:
        "200":
          description: Provider descriptors.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderDescriptor"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/events/stream:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Subscribe to daemon events.
      description: Streams timestamped lifecycle, segmentation, and workflow events as Server-Sent Events.
      responses:
        "200":
          description: Server-Sent Events stream.
          content:
            text/event-stream:
              schema:
                type: string
  /v1/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List tracked dictation sessions.
      description: |
        Returns the daemon's in-memory session table sorted by `created_at_millis`.
        Completed and failed sessions remain visible until the daemon restarts so
        callers can recover a `session_id` after the fact.
      responses:
        "200":
          description: Tracked dictation sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaptureSession"
  /v1/sessions/dictation:
    post:
      operationId: startLiveDictationSession
      tags: [sessions]
      summary: Start a live dictation session.
      description: Creates a dictation session, opens microphone capture, and starts optional segmented transcription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartDictationRequest"
      responses:
        "200":
          description: Dictation session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureSession"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/sessions/dictation/stop:
    post:
      operationId: stopLiveDictationSession
      tags: [sessions]
      summary: Stop a live dictation session and return its transcript.
      description: Ends audio capture, waits for pending transcription work, and returns the final session result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopDictationRequest"
      responses:
        "200":
          description: Dictation capture result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictationCaptureResult"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/Problem"
  /v1/sessions/compose:
    post:
      operationId: createCompositionJob
      tags: [workflows]
      summary: Compose structured text from a spoken prompt.
      description: Sends a composition prompt to the configured LLM provider and returns a preview artifact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeRequest"
      responses:
        "200":
          description: Composition job receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositionReceipt"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/rewrites:
    post:
      operationId: rewriteText
      tags: [workflows]
      summary: Rewrite existing text in a requested style.
      description: Sends source text and a target rewrite style to the configured LLM provider and returns a preview artifact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewriteRequest"
      responses:
        "200":
          description: Rewrite job receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositionReceipt"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/translations:
    post:
      operationId: translateText
      tags: [workflows]
      summary: Translate text to a target language.
      description: Sends source text and a target language to the configured LLM provider and returns a preview artifact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateRequest"
      responses:
        "200":
          description: Translation job receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositionReceipt"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/transcriptions:
    post:
      operationId: transcribeAudioFile
      tags: [transcription]
      summary: Transcribe a local audio file.
      description: Dispatches a local audio file path to the configured ASR provider through the Python worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeRequest"
      responses:
        "200":
          description: Transcription result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResult"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/dictation/capture:
    post:
      operationId: captureDictation
      tags: [transcription]
      summary: Record a bounded clip and transcribe it.
      description: Captures microphone audio for a fixed number of seconds, transcribes the clip, and returns the completed session result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictationCaptureRequest"
      responses:
        "200":
          description: Dictation capture result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictationCaptureResult"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/inject:
    post:
      operationId: planInjection
      tags: [injection]
      summary: Build a target-specific injection plan.
      description: Formats text locally for the requested target (such as bracketed paste) without sending keystrokes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InjectRequest"
      responses:
        "200":
          description: Injection plan response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InjectionPlan"
components:
  responses:
    Problem:
      description: RFC 9457 problem details describing the failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          description: Problem type URN, e.g. `urn:voicelayer:problem:provider_unavailable`.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
      description: |
        Problem type registry:
        - `urn:voicelayer:problem:bad_request` (400)
        - `urn:voicelayer:problem:session_not_found` (404)
        - `urn:voicelayer:problem:recording_failed` (500)
        - `urn:voicelayer:problem:internal` (500)
        - `urn:voicelayer:problem:provider_request_failed` (502)
        - `urn:voicelayer:problem:provider_unavailable` (503)
        - `urn:voicelayer:problem:worker_unavailable` (503)
        - `urn:voicelayer:problem:worker_timeout` (504)
    HealthResponse:
      type: object
      required: [status, socket_path, version, worker]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        socket_path:
          type: string
        version:
          type: string
        worker:
          $ref: "#/components/schemas/WorkerHealthSummary"
    WorkerHealthSummary:
      type: object
      required:
        - status
        - command
        - asr_configured
        - mimo_configured
        - qwen3_asr_configured
        - llm_configured
        - llm_reachable
        - global_hotkeys_available
      properties:
        status:
          description: Overall worker probe status.
          type: string
          enum: [ok, degraded, unavailable]
        command:
          description: Worker command line configured for the daemon.
          type: string
        asr_configured:
          description: True when whisper.cpp (server or CLI) is configured and ready.
          type: boolean
        asr_binary:
          description: Resolved whisper-cli or whisper-server binary path when configured.
          type:
            - string
            - "null"
        asr_model_path:
          description: Configured ggml whisper model path when present.
          type:
            - string
            - "null"
        asr_error:
          description: Validation or reachability error for the whisper.cpp ASR path.
          type:
            - string
            - "null"
        whisper_mode:
          description: |
            Active whisper dispatch mode: `server` (persistent whisper-server over HTTP),
            `cli` (one-shot whisper-cli subprocess), or `unconfigured`.
          type:
            - string
            - "null"
        whisper_server_url:
          description: Base URL of the configured whisper-server endpoint (e.g. `http://127.0.0.1:8188`).
          type:
            - string
            - "null"
        mimo_configured:
          description: |
            True when Xiaomi MiMo-V2.5-ASR model and tokenizer directories exist on disk.
            Weights are loaded lazily on the first transcription call.
          type: boolean
        mimo_model_path:
          description: Configured model weight directory for MiMo-V2.5-ASR.
          type:
            - string
            - "null"
        mimo_error:
          description: Reason MiMo-V2.5-ASR is not ready when `mimo_configured` is `false`.
          type:
            - string
            - "null"
        qwen3_asr_configured:
          description: |
            True when Alibaba Qwen3-ASR-1.7B model directory exists on disk.
            Weights are loaded lazily on the first transcription call.
          type: boolean
        qwen3_asr_model_path:
          description: Configured model weight directory for Qwen3-ASR-1.7B.
          type:
            - string
            - "null"
        qwen3_asr_error:
          description: Reason Qwen3-ASR-1.7B is not ready when `qwen3_asr_configured` is `false`.
          type:
            - string
            - "null"
        llm_configured:
          description: True when an OpenAI-compatible LLM endpoint and model are configured.
          type: boolean
        llm_model:
          description: Configured LLM model identifier.
          type:
            - string
            - "null"
        llm_endpoint:
          description: Normalized chat completions endpoint URL.
          type:
            - string
            - "null"
        llm_reachable:
          description: True when the LLM `/v1/models` health probe succeeded.
          type: boolean
        llm_error:
          description: Configuration or connectivity error for the LLM endpoint.
          type:
            - string
            - "null"
        global_hotkeys_available:
          description: |
            True when the host platform can deliver global hotkeys (XDG GlobalShortcuts
            portal on Linux, Carbon `RegisterEventHotKey` on macOS).
          type: boolean
        global_hotkeys_backend:
          description: Active hotkey backend (`xdg_portal` on Linux, `global_hotkey` on macOS).
          type:
            - string
            - "null"
        global_hotkeys_detail:
          description: Host hotkey probe detail or failure message.
          type:
            - string
            - "null"
        message:
          description: Summary diagnostic message for degraded or unavailable states.
          type:
            - string
            - "null"
    ProviderDescriptor:
      type: object
      required:
        - id
        - kind
        - transport
        - local
        - default_enabled
        - experimental
        - license
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [asr, llm, tts, host_adapter]
        transport:
          type: string
        local:
          type: boolean
        default_enabled:
          type: boolean
        experimental:
          type: boolean
        license:
          type: string
    LanguageProfile:
      type: object
      required: [strategy, input_languages]
      properties:
        strategy:
          type: string
          enum: [auto_detect, locked, follow_previous, bilingual]
        input_languages:
          type: array
          items:
            type: string
        output_language:
          type:
            - string
            - "null"
    StartDictationRequest:
      type: object
      required: [trigger]
      properties:
        trigger:
          type: string
          enum: [push_to_talk, toggle, cli, tui, tray_button]
        language_profile:
          $ref: "#/components/schemas/LanguageProfile"
        translate_to_english:
          type: boolean
        keep_audio:
          type: boolean
        segmentation:
          $ref: "#/components/schemas/SegmentationMode"
        provider_id:
          description: |
            Optional ASR provider used for every transcription emitted by this session
            (one-shot stop, fixed-window segments, and VAD-gated speech units).
            Omit to use the configured whisper.cpp chain (`whisper-server` preferred,
            `whisper-cli` fallback). Unknown IDs fail with `provider_unavailable`.
          type:
            - string
            - "null"
          enum:
            - whisper_cpp
            - mimo_v2_5_asr
            - qwen3_asr_1_7b
            - null
    SegmentationMode:
      description: |
        Controls how audio capture is partitioned during a live dictation session.
        Defaults to `one_shot`, which transcribes the full capture on stop.
        `fixed` slices the capture buffer every `segment_secs` seconds and transcribes
        each chunk in the background. `vad_gated` slices probes every `probe_secs`
        seconds, classifies them via `segment_probe` (Silero VAD), accumulates speech
        probes, and flushes to `transcribe` after `silence_gap_probes` consecutive
        silent probes or when buffered audio reaches `max_segment_secs`.
      oneOf:
        - type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [one_shot]
        - type: object
          required: [mode, segment_secs]
          properties:
            mode:
              type: string
              enum: [fixed]
            segment_secs:
              type: integer
              minimum: 1
              description: Duration of each captured segment in whole seconds.
        - type: object
          required: [mode, probe_secs, max_segment_secs]
          properties:
            mode:
              type: string
              enum: [vad_gated]
            probe_secs:
              type: integer
              minimum: 1
              description: Duration of each VAD classification probe in whole seconds.
            max_segment_secs:
              type: integer
              minimum: 1
              description: Maximum buffered speech duration before forcing a flush, in whole seconds.
            silence_gap_probes:
              type: integer
              minimum: 0
              default: 1
              description: Consecutive silent probes required to flush pending speech.
    StopDictationRequest:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
          format: uuid
    DictationCaptureRequest:
      type: object
      required: [trigger, duration_seconds]
      properties:
        trigger:
          type: string
          enum: [push_to_talk, toggle, cli, tui, tray_button]
        language_profile:
          $ref: "#/components/schemas/LanguageProfile"
        duration_seconds:
          type: integer
          minimum: 1
        translate_to_english:
          type: boolean
        keep_audio:
          type: boolean
        provider_id:
          description: |
            Optional ASR provider for this capture. Defaults to the configured
            whisper.cpp chain when omitted; unknown IDs fail with `provider_unavailable`.
          type:
            - string
            - "null"
          enum:
            - whisper_cpp
            - mimo_v2_5_asr
            - qwen3_asr_1_7b
            - null
    CaptureSession:
      type: object
      required:
        - session_id
        - mode
        - state
        - trigger
        - language_profile
        - created_at_millis
      properties:
        session_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [dictation, compose, rewrite, translate]
        state:
          type: string
          enum: [idle, listening, transcribing, previewing, awaiting_confirmation, completed, failed]
        trigger:
          type: string
          enum: [push_to_talk, toggle, cli, tui, tray_button]
        language_profile:
          $ref: "#/components/schemas/LanguageProfile"
        created_at_millis:
          type: integer
          format: int64
    ComposeRequest:
      type: object
      required: [spoken_prompt]
      properties:
        spoken_prompt:
          type: string
        archetype:
          type: string
          enum:
            - email
            - cover_letter
            - daily_report
            - issue
            - pull_request_description
            - prompt
            - technical_summary
            - custom
        output_language:
          type:
            - string
            - "null"
    RewriteRequest:
      type: object
      required: [source_text, style]
      properties:
        source_text:
          type: string
        style:
          type: string
          enum: [more_formal, shorter, politer, more_technical, translate]
        output_language:
          type:
            - string
            - "null"
    TranslateRequest:
      type: object
      required: [source_text, target_language]
      properties:
        source_text:
          type: string
        target_language:
          type: string
    TranscribeRequest:
      type: object
      required: [audio_file]
      properties:
        audio_file:
          type: string
        language:
          type:
            - string
            - "null"
        translate_to_english:
          type: boolean
        provider_id:
          description: |
            Optional ASR provider identifier. Defaults to the configured whisper.cpp chain
            (`whisper-server` preferred, `whisper-cli` fallback). Unknown IDs fail with
            `provider_unavailable` rather than falling back to whisper.
          type:
            - string
            - "null"
          enum:
            - whisper_cpp
            - mimo_v2_5_asr
            - qwen3_asr_1_7b
            - null
    PreviewArtifact:
      type: object
      required: [artifact_id, status, title, notes]
      properties:
        artifact_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ready, needs_provider, rejected]
        title:
          type: string
        generated_text:
          type:
            - string
            - "null"
        notes:
          type: array
          items:
            type: string
    CompositionReceipt:
      type: object
      required: [job_id, preview]
      properties:
        job_id:
          type: string
          format: uuid
        preview:
          $ref: "#/components/schemas/PreviewArtifact"
    InjectRequest:
      type: object
      required: [target, text]
      properties:
        target:
          type: string
          enum:
            - gui_accessible
            - gui_clipboard
            - terminal_bracketed_paste
            - terminal_kitty_remote
        text:
          type: string
        auto_submit:
          type: boolean
          default: false
    InjectionPlan:
      type: object
      required: [target, payload, auto_submit]
      properties:
        target:
          type: string
          enum:
            - gui_accessible
            - gui_clipboard
            - terminal_bracketed_paste
            - terminal_kitty_remote
        payload:
          type: string
        auto_submit:
          type: boolean
    TranscriptionResult:
      type: object
      required: [text, notes]
      properties:
        text:
          type: string
        detected_language:
          type:
            - string
            - "null"
        notes:
          type: array
          items:
            type: string
    DictationCaptureResult:
      type: object
      required: [session, transcription]
      properties:
        session:
          $ref: "#/components/schemas/CaptureSession"
        transcription:
          $ref: "#/components/schemas/TranscriptionResult"
        audio_file:
          type:
            - string
            - "null"
