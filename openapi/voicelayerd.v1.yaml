openapi: 3.1.0
info:
  title: VoiceLayer Local Control API
  version: 0.2.0
  contact:
    name: VoiceLayer maintainers
  description: |
    Local control API exposed by the VoiceLayer daemon over a Unix domain socket.

    Error model: failures return a semantic 4xx/5xx status with an RFC 9457
    `application/problem+json` body. Success payloads never encode errors.
servers:
  - url: http://localhost
    description: Logical placeholder. The daemon is served over a Unix domain socket.
tags:
  - name: health
  - name: providers
  - name: events
  - name: dictation
  - name: composition
  - name: transcription
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Read the cached daemon health snapshot (cheap liveness).
      description: |
        Returns the most recent health snapshot without probing the worker or
        platform; the daemon refreshes the snapshot in the background. Use
        `POST /v1/health/refresh` for an on-demand deep probe.
      responses:
        "200":
          description: Daemon health report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/health/refresh:
    post:
      operationId: refreshHealth
      tags: [health]
      description: Probes the worker and platform on demand and returns a fresh health report.
      summary: Force a fresh worker + platform probe and return the result.
      responses:
        "200":
          description: Freshly probed daemon health report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/providers:
    get:
      operationId: listProviders
      tags: [providers]
      description: Lists host adapters plus the providers reported by the worker.
      summary: List supported providers and host adapters.
      responses:
        "200":
          description: Provider descriptors.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderDescriptor"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/events/stream:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Subscribe to daemon events.
      description: |
        Server-Sent Events stream. The SSE `event:` field carries the typed
        event name (`dictation_session_created`, `segment_recorded`, ...);
        the `data:` field carries the full event envelope JSON. When a
        subscriber lags behind the broadcast channel, the daemon emits a
        synthetic `events_lost` event with the dropped count.
      responses:
        "200":
          description: Server-Sent Events stream.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
  /v1/sessions/dictation:
    post:
      operationId: startLiveDictationSession
      tags: [dictation]
      description: Starts in-process audio capture and returns the new session.
      summary: Create a live dictation session and start capturing audio.
      responses:
        "200":
          description: Dictation session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureSession"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartDictationRequest"
  /v1/sessions/dictation/stop:
    post:
      operationId: stopLiveDictationSession
      tags: [dictation]
      description: Stops capture, transcribes the audio, and returns the result.
      summary: Stop a live dictation session, transcribe the captured audio, and return the result.
      responses:
        "200":
          description: Dictation capture result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictationCaptureResult"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopDictationRequest"
  /v1/sessions/compose:
    post:
      operationId: createCompositionJob
      tags: [composition]
      description: Runs a composition request through the configured LLM provider.
      summary: Run a composition request and return a preview artifact.
      responses:
        "200":
          description: Composition job receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositionReceipt"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeRequest"
  /v1/rewrites:
    post:
      operationId: rewriteText
      tags: [composition]
      description: Runs a rewrite request through the configured LLM provider.
      summary: Run a rewrite request and return a preview artifact.
      responses:
        "200":
          description: Rewrite job receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositionReceipt"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewriteRequest"
  /v1/translations:
    post:
      operationId: translateText
      tags: [composition]
      description: Runs a translation request through the configured LLM provider.
      summary: Run a translation request and return a preview artifact.
      responses:
        "200":
          description: Translation job receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositionReceipt"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateRequest"
  /v1/transcriptions:
    post:
      operationId: transcribeAudioFile
      tags: [transcription]
      description: Transcribes a local audio file through the configured ASR provider.
      summary: Transcribe a local audio file through the configured ASR provider.
      responses:
        "200":
          description: Transcription result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResult"
        "400":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeRequest"
  /v1/dictation/capture:
    post:
      operationId: captureDictation
      tags: [dictation]
      description: Records a fixed-duration clip in-process and transcribes it.
      summary: Record a short clip, transcribe it, and return the resulting dictation session.
      responses:
        "200":
          description: Dictation capture result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictationCaptureResult"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictationCaptureRequest"
components:
  responses:
    Problem:
      description: RFC 9457 problem details describing the failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          description: Problem type URN, e.g. `urn:voicelayer:problem:provider_unavailable`.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
      description: |
        Problem type registry:
        - `urn:voicelayer:problem:bad_request` (400)
        - `urn:voicelayer:problem:session_not_found` (404)
        - `urn:voicelayer:problem:recording_failed` (500)
        - `urn:voicelayer:problem:internal` (500)
        - `urn:voicelayer:problem:provider_request_failed` (502)
        - `urn:voicelayer:problem:provider_unavailable` (503)
        - `urn:voicelayer:problem:worker_unavailable` (503)
        - `urn:voicelayer:problem:worker_timeout` (504)
    HealthResponse:
      type: object
      required: [status, socket_path, version, worker]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        socket_path:
          type: string
        version:
          type: string
        worker:
          $ref: "#/components/schemas/WorkerHealthSummary"
    WorkerHealthSummary:
      type: object
      required: [status, command]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        command:
          type: string
        asr_configured:
          type: boolean
        asr_binary:
          type:
            - string
            - "null"
        asr_model_path:
          type:
            - string
            - "null"
        asr_error:
          type:
            - string
            - "null"
        llm_configured:
          type: boolean
        llm_model:
          type:
            - string
            - "null"
        llm_endpoint:
          type:
            - string
            - "null"
        llm_reachable:
          type: boolean
        llm_error:
          type:
            - string
            - "null"
        global_hotkeys_available:
          type: boolean
        global_hotkeys_backend:
          type:
            - string
            - "null"
          description: xdg_portal on Linux, global_hotkey on macOS.
        global_hotkeys_detail:
          type:
            - string
            - "null"
        message:
          type:
            - string
            - "null"
    ProviderDescriptor:
      type: object
      required:
        - id
        - kind
        - transport
        - local
        - default_enabled
        - experimental
        - license
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [asr, llm, tts, host_adapter]
        transport:
          type: string
        local:
          type: boolean
        default_enabled:
          type: boolean
        experimental:
          type: boolean
        license:
          type: string
    EventEnvelope:
      type: object
      required: [created_at_millis, event_type]
      properties:
        created_at_millis:
          type: integer
          format: int64
        event_type:
          type: string
          enum:
            - dictation_session_created
            - dictation_listening
            - dictation_transcribing
            - dictation_completed
            - dictation_failed
            - dictation_segmented_started
            - segment_recorded
            - segment_transcribed
            - segment_transcribe_failed
            - compose_job_created
            - rewrite_job_created
            - translate_job_created
            - transcription_completed
            - worker_providers_unavailable
            - events_lost
      description: |
        The envelope flattens the typed event payload: every event carries
        `created_at_millis` and `event_type`, plus event-specific fields
        (e.g. `session_id`, `segment_id`, `transcript_chars`, `detail`,
        `count`).
    LanguageProfile:
      type: object
      required: [strategy, input_languages]
      properties:
        strategy:
          type: string
          enum: [auto_detect, locked, follow_previous, bilingual]
        input_languages:
          type: array
          items:
            type: string
        output_language:
          type:
            - string
            - "null"
    StartDictationRequest:
      type: object
      required: [trigger]
      properties:
        trigger:
          type: string
          enum: [push_to_talk, toggle, cli, tui, tray_button]
        language_profile:
          $ref: "#/components/schemas/LanguageProfile"
        translate_to_english:
          type: boolean
        keep_audio:
          type: boolean
        segmentation:
          $ref: "#/components/schemas/SegmentationMode"
    SegmentationMode:
      description: |
        Controls how the continuous capture buffer is cut during a live
        dictation session. When omitted the daemon uses `one_shot` (a single
        transcription at stop). `fixed` cuts a chunk every `segment_secs`
        seconds so each chunk is transcribed while capture continues; chunks
        are cut from one uninterrupted stream, so no audio is lost at
        boundaries.
      oneOf:
        - type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [one_shot]
        - type: object
          required: [mode, segment_secs]
          properties:
            mode:
              type: string
              enum: [fixed]
            segment_secs:
              type: integer
              minimum: 1
              description: Duration of each captured segment in whole seconds.
    StopDictationRequest:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
          format: uuid
    DictationCaptureRequest:
      type: object
      required: [trigger, duration_seconds]
      properties:
        trigger:
          type: string
          enum: [push_to_talk, toggle, cli, tui, tray_button]
        language_profile:
          $ref: "#/components/schemas/LanguageProfile"
        duration_seconds:
          type: integer
          minimum: 1
        translate_to_english:
          type: boolean
        keep_audio:
          type: boolean
    CaptureSession:
      type: object
      required:
        - session_id
        - mode
        - state
        - trigger
        - language_profile
        - created_at_millis
      properties:
        session_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [dictation, compose, rewrite, translate]
        state:
          type: string
          enum: [idle, listening, transcribing, previewing, awaiting_confirmation, completed, failed]
        trigger:
          type: string
          enum: [push_to_talk, toggle, cli, tui, tray_button]
        language_profile:
          $ref: "#/components/schemas/LanguageProfile"
        created_at_millis:
          type: integer
          format: int64
    ComposeRequest:
      type: object
      required: [spoken_prompt]
      properties:
        spoken_prompt:
          type: string
        archetype:
          type: string
          enum:
            - email
            - cover_letter
            - daily_report
            - issue
            - pull_request_description
            - prompt
            - technical_summary
            - custom
        output_language:
          type:
            - string
            - "null"
    RewriteRequest:
      type: object
      required: [source_text, style]
      properties:
        source_text:
          type: string
        style:
          type: string
          enum: [more_formal, shorter, politer, more_technical]
        output_language:
          type:
            - string
            - "null"
    TranslateRequest:
      type: object
      required: [source_text, target_language]
      properties:
        source_text:
          type: string
        target_language:
          type: string
    TranscribeRequest:
      type: object
      required: [audio_file]
      properties:
        audio_file:
          type: string
        language:
          type:
            - string
            - "null"
        translate_to_english:
          type: boolean
    PreviewArtifact:
      type: object
      required: [artifact_id, status, title, notes]
      properties:
        artifact_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ready, rejected]
        title:
          type: string
        generated_text:
          type:
            - string
            - "null"
        notes:
          type: array
          items:
            type: string
    CompositionReceipt:
      type: object
      required: [job_id, preview]
      properties:
        job_id:
          type: string
          format: uuid
        preview:
          $ref: "#/components/schemas/PreviewArtifact"
    TranscriptionResult:
      type: object
      required: [text, notes]
      properties:
        text:
          type: string
        detected_language:
          type:
            - string
            - "null"
        notes:
          type: array
          items:
            type: string
    DictationCaptureResult:
      type: object
      required: [session, transcription]
      properties:
        session:
          $ref: "#/components/schemas/CaptureSession"
        transcription:
          $ref: "#/components/schemas/TranscriptionResult"
        audio_file:
          type:
            - string
            - "null"
          description: |
            Present only when the request set `keep_audio`. For one-shot
            captures this is the WAV file path; for segmented sessions it is
            the segment directory (one WAV per segment, zero-padded names).
