name: Feature request
description: Suggest a capability or improvement for VoiceLayer.
title: "feat: <short description>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a new capability, provider integration, or workflow improvement for Ubuntu or macOS desktops.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - daemon
        - cli
        - desktop
        - worker
        - docs
        - build
        - other
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What workflow does this enable or improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        Describe the intended behavior, API surface, or UX, including host constraints
        (Wayland, AT-SPI, PipeWire, XDG portals, or CoreAudio/macOS) and local-first defaults.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes required to close this issue.
      placeholder: |
        - Daemon exposes ...
        - CLI accepts ...
        - Documentation updated under docs/
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other approaches and why they were not chosen.
