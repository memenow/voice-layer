name: Bug report
description: Report a defect in VoiceLayer.
title: "bug: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Include your host OS, toolchain versions, and the smallest steps needed to reproduce the issue.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which subsystem is involved?
      options:
        - daemon
        - cli
        - desktop
        - worker
        - docs
        - build
        - other
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Operating system and display server
      description: e.g. "Ubuntu 24.04, GNOME Wayland" or "macOS 15, Apple Silicon".
      placeholder: "Ubuntu 24.04, GNOME Wayland"
    validations:
      required: true
  - type: input
    id: rust
    attributes:
      label: Rust toolchain
      description: Output of `rustc --version`.
      placeholder: "rustc 1.100.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python toolchain (uv)
      description: Output of `uv run python --version` and `uv --version`.
      placeholder: "Python 3.12.x, uv 0.13.x"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal commands and configuration needed to reproduce.
      placeholder: |
        1. Start the daemon with `cargo run -p voicelayerd`.
        2. Run `cargo run -p voicelayer-cli -- record-transcribe --duration-seconds 5`.
        3. Observe the failure.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: |
        Relevant excerpts from daemon logs, `vl doctor`, or terminal output.
        Redact secrets before pasting.
      render: shell
  - type: checkboxes
    id: hygiene
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I redacted secrets, tokens, and personal data from logs.
          required: true
