name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install system dependencies for vl-desktop and the recorder probe
        # apt exists only on the Ubuntu runner; macOS has no system
        # package step (pkg-config and friends ship with the image).
        if: matrix.os == 'ubuntu-latest'
        # The Azure apt mirror on hosted runners occasionally stalls on
        # `Ign:` responses and drags `apt-get update` past the job
        # timeout (observed 2026-04-22, run 24774249846). Cap per-request
        # HTTP(S) timeouts and wrap update + install in a bounded retry
        # so a dead mirror fails fast and we get a second chance to pick
        # up a healthy one.
        run: |
          set -euo pipefail
          apt_opts=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          run_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "::warning::apt command failed on attempt ${attempt}: $*" >&2
              sleep $((attempt * 15))
            done
            echo "::error::apt command failed after 3 attempts: $*" >&2
            return 1
          }
          run_with_retry sudo apt-get "${apt_opts[@]}" update
          run_with_retry sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-cursor0 \
            libwayland-egl1 \
            libdbus-1-dev \
            libgl1-mesa-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            alsa-utils \
            libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # `cargo test --all` exercises the daemon's persistent Python
      # worker bridge in `voicelayerd::worker` tests, which spawn the
      # real `python -m voicelayer_orchestrator.worker` (or the mock
      # JSON-RPC fixture under `crates/voicelayerd/tests/fixtures/`)
      # via `uv run`. The job therefore needs uv + Python 3.12 +
      # the synced dev env on PATH, otherwise the worker tests fail
      # with `Io(NotFound)` even though every other rust test passes.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync Python dev environment
        run: uv sync --group dev

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets --all-features -- -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test --all
        run: cargo test --all

      - name: Lint the OpenAPI contract
        if: matrix.os == 'ubuntu-latest'
        run: npx --yes @stoplight/spectral-cli lint openapi/voicelayerd.v1.yaml

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync Python dev environment
        run: uv sync --group dev

      - name: uv run ruff check python tests/python
        run: uv run ruff check python tests/python

      - name: uv run ruff format --check python tests/python
        run: uv run ruff format --check python tests/python

      - name: uv run pytest -q tests/python
        run: uv run pytest -q tests/python

  shell-lint:
    name: shell-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: shellcheck scripts/*.sh
        run: shellcheck scripts/*.sh

  openapi-lint:
    name: openapi-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # `redocly.yaml` extends Redocly's `minimal` ruleset and
      # disables checks that assume a public HTTP API: `voicelayerd`
      # serves over a Unix domain socket with socket-permission
      # access control, so transport-level `security:` blocks
      # would advertise an authentication scheme that does not
      # exist.
      - name: redocly lint openapi/voicelayerd.v1.yaml
        run: npx -y @redocly/cli@1.34.2 lint --config redocly.yaml openapi/voicelayerd.v1.yaml

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Audit gates on real safety findings. Vulnerabilities are
      # fatal by default (cargo-audit exits non-zero whenever the
      # advisory DB lists an active CVE for any compiled crate);
      # `--deny unsound` lifts soundness advisories to the same
      # bar. Maintenance-status warnings (unmaintained, yanked,
      # notice) are not auto-failed because VoiceLayer pulls a
      # number of GUI / GPU crates transitively and has no
      # upstream path to retire every unmaintained macro crate the
      # moment RustSec flags it. Such warnings are logged for the
      # maintainer to triage; the explicit allow-list with
      # justification lives in `.cargo/audit.toml`.
      - name: cargo audit --deny unsound
        run: cargo audit --deny unsound
