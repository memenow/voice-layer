[workspace]
members = [
  "crates/voicelayer-cli",
  "crates/voicelayer-core",
  "crates/voicelayer-desktop",
  "crates/voicelayer-testkit",
  "crates/voicelayer-ui",
  "crates/voicelayerd",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.100"
version = "0.2.0"

[workspace.dependencies]
arboard = "3.7.0"
axum = { version = "0.8.9", features = ["http1", "json", "macros"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
bytes = "1.12.2"
clap = { version = "4.6.10", features = ["derive", "env"] }
cpal = "0.18.2"
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = "0.3.34"
hound = "3.5.1"
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.3"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
uuid = { version = "1.29.3", features = ["serde", "v4"] }
voicelayer-core = { path = "crates/voicelayer-core" }
voicelayer-testkit = { path = "crates/voicelayer-testkit" }
voicelayer-ui = { path = "crates/voicelayer-ui" }
zbus = { version = "6.5.0", default-features = true }
