# `cargo audit` configuration used locally and in CI (`cargo audit --deny unsound`).
# Vulnerabilities are never ignored here; ignored advisories below are limited to
# transitive crates without an iced 0.14-compatible upstream release.

[advisories]
ignore = [
    # `paste 1.0.15` (unmaintained) via metal -> wgpu-hal -> wgpu -> iced_wgpu -> iced 0.14.
    # Compile-time proc-macro only; no compatible upstream release drops it yet.
    "RUSTSEC-2024-0436",
    # `lru 0.16.x` `LruCache::pop()` panic-safety issue via cryoglyph 0.1.0 -> iced_wgpu -> iced 0.14.
    # Fix requires lru >= 0.18.2 (not compatible with cryoglyph 0.1.0 / iced 0.14).
    # Unreachable here: cryoglyph's cache stores plain Copy/data types without Drop impls.
    "RUSTSEC-2026-0253",
    # `ttf-parser 0.25.1` (unmaintained) via fontdb -> cosmic-text -> iced 0.14.
    # No iced 0.14-compatible upstream release replaces it yet.
    "RUSTSEC-2026-0192",
]
