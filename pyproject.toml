[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voicelayer-worker"
version = "0.2.0"
description = "Python worker for VoiceLayer speech and text inference"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.29.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
vad = [
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
]
# Optional MiMo-V2.5-ASR GPU backend (CUDA-only).
# Upstream MimoAudio is loaded from a local checkout pointed to by VOICELAYER_MIMO_REPO_PATH.
# torch and torchaudio keep >=2.7.0,<3.0 so CUDA operators can install matching PyTorch wheels.
# flash-attn must be installed separately for the operator's CUDA/torch ABI.
# WAV decoding uses soundfile directly, so torchcodec is not required.
mimo = [
    "torch>=2.7.0,<3.0",
    "torchaudio>=2.7.0,<3.0",
    "transformers==4.49.0",
    "accelerate>=1.12.0",
    "librosa>=1.0.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "zhon==2.1.1",
]
# Optional Qwen3-ASR-1.7B backend via the official qwen-asr package.
# qwen-asr pins transformers==4.57.6, which conflicts with mimo (transformers==4.49.0);
# install each GPU provider extra in its own virtualenv.
qwen3-asr = [
    "torch>=2.7.0,<3.0",
    "torchaudio>=2.7.0,<3.0",
    "transformers>=4.57.0",
    "qwen-asr>=0.0.6,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.6",
]

# Declare mutual exclusion so uv can resolve both optional branches in one universal lockfile.
[tool.uv]
conflicts = [
    [{ extra = "mimo" }, { extra = "qwen3-asr" }],
]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
