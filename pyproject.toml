[build-system]
requires = ["setuptools>=82.0.1", "wheel>=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "voicelayer-orchestrator"
version = "0.1.0"
description = "Python workers for VoiceLayer model orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
vad = [
    "numpy>=2.0",
    "onnxruntime>=1.18",
]
# MiMo-V2.5-ASR (Xiaomi) optional GPU provider. CUDA-only at the moment.
# The `MimoAudio` wrapper class lives in the upstream source tree and
# is not currently published as a wheel — operators clone
# https://github.com/XiaomiMiMo/MiMo-V2.5-ASR and point
# VOICELAYER_MIMO_REPO_PATH at the checkout.
#
# `torch` and `torchaudio` are intentionally NOT pinned here: the wheel
# matching the operator's CUDA capability has to come from the PyTorch
# index (e.g., `--index-url https://download.pytorch.org/whl/cu128` for
# Blackwell sm_120), and pinning a version on PyPI would silently pull
# the CPU-only build instead. The lower bound (>= 2.7.0) is the floor
# of the cu128 index; the upper bound is held to the next major version
# of torch.
#
# The audio tokenizer's `from flash_attn import flash_attn_varlen_func`
# means flash-attn is a hard requirement of the runtime path, not just
# a recommended optimisation as the model card implies. flash-attn does
# not ship binary wheels on PyPI today; operators install one of
# Dao-AILab's GitHub release wheels manually after torch is in place
# (the wheels are tagged `cu12torch2.{X}`). docs/guides/local-asr-provider.md
# tracks the working combination — currently
# `flash-attn==2.8.1+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64`
# against `torch==2.10.0+cu128` for Blackwell.
#
# `torchcodec` is required by `torchaudio>=2.10` for `torchaudio.load`,
# but our provider bypasses that path by pre-loading the WAV through
# `soundfile` and handing the wrapper a tensor — so torchcodec stays
# off the runtime dependency list.
mimo = [
    "torch>=2.7.0,<3.0",
    "torchaudio>=2.7.0,<3.0",
    "transformers==4.49.0",
    "accelerate>=1.9.0",
    "librosa>=0.11.0",
    "scipy>=1.16.1",
    "soundfile>=0.12",
    "zhon==2.1.1",
]
# Qwen3-ASR-1.7B (Apache-2.0) optional ASR provider. Loaded through the
# official `qwen-asr` pip wrapper which sits on top of HuggingFace
# transformers; the wrapper handles audio preprocessing and long-audio
# chunking internally, so the worker hands it raw WAV paths and trusts
# it for the rest. Operators stage the weights via
# `hf download Qwen/Qwen3-ASR-1.7B --local-dir <path>` and point
# `VOICELAYER_QWEN3_ASR_MODEL_PATH` at the directory.
#
# `torch` and `torchaudio` are intentionally NOT pinned here for the
# same reason as the `mimo` extra: the operator pulls a CUDA wheel
# from the PyTorch index that matches their GPU compute capability,
# and pinning a version on PyPI would silently install the CPU-only
# build. The lower bound (>= 2.7.0) is the floor of the cu128 index;
# the upper bound is held to the next major torch.
#
# `qwen-asr` brings its own transformers floor — the model card was
# saved under transformers 4.57.6, so the wrapper drives that range.
# Installing this extra alongside `mimo` in the same environment will
# fight over `transformers` (MiMo pins 4.49.0); the recommended
# practice is one provider extra per virtualenv.
qwen3-asr = [
    "torch>=2.7.0,<3.0",
    "torchaudio>=2.7.0,<3.0",
    "qwen-asr>=0.0.6,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15.11",
]

# The `mimo` extra pins `transformers==4.49.0` for compatibility with
# Xiaomi's wrapper, while `qwen3-asr` pulls `qwen-asr` which tracks the
# transformers floor of the saved model card (4.57.x). Each provider
# can be installed on its own, but they cannot co-exist in the same
# virtualenv. Declaring the conflict lets uv produce a single
# universal lockfile that resolves each branch independently.
[tool.uv]
conflicts = [
    [{ extra = "mimo" }, { extra = "qwen3-asr" }],
]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
